name: Verify Windows Compose

on:
  push:
    branches: [verify/836-windows-compose]

concurrency:
  group: windows-compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-compose:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify non-admin build and host artifact
        shell: pwsh
        run: ./scripts/verify-windows-compose-837.ps1
