name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions (read-only)
permissions:
  contents: read

jobs:
  # Test the same pinned release and resolver on both supported platforms.
  lint-cpp-platform:
    name: Lint C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install locked LLVM
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          # Exercise script-side resolution, without activating LLVM in the shell.
          export_path: false
          env: false

      - name: Test resolver and check C++ formatting
        env:
          VELOCITYDB_TEST_LLVM: '1'
          VELOCITYDB_FORMAT_MANIFEST: ${{ runner.temp }}/format-manifest.json
        run: uv run --with pytest python -m pytest scripts/tests/test_llvm.py scripts/tests/test_llvm_integration.py -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpp-format-${{ matrix.os }}
          path: ${{ runner.temp }}/format-manifest.json
          retention-days: 1
          if-no-files-found: error

  # Preserve the existing check name and require identical formatting on both OSes.
  lint-cpp:
    name: Lint C++
    runs-on: ubuntu-latest
    needs: lint-cpp-platform
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cpp-format-*
          path: format-results
      - name: Compare Windows and Linux formatting
        run: diff -u format-results/cpp-format-ubuntu-latest/format-manifest.json format-results/cpp-format-windows-latest/format-manifest.json

  # Frontend lint (parallel with C++ lint)
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          working-directory: frontend
          cache: true
          run-install: false

      - name: Install dependencies
        working-directory: frontend
        run: vp install --frozen-lockfile

      - name: Lint and Type Check (parallel)
        working-directory: frontend
        run: |
          vp check &
          LINT_PID=$!
          vp run typecheck &
          TYPECHECK_PID=$!
          wait $LINT_PID
          wait $TYPECHECK_PID

  # Compatibility job for branch protection rules
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [lint-cpp, lint-frontend]
    if: always() && needs.lint-cpp.result == 'success' && needs.lint-frontend.result == 'success'
    steps:
      - run: echo "All lint checks passed"

  # Frontend build and test (depends on frontend lint only)
  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    if: always() && needs.lint-frontend.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          working-directory: frontend
          cache: true
          run-install: false

      - name: Install dependencies
        working-directory: frontend
        run: vp install --frozen-lockfile

      - name: Build and Test (parallel)
        working-directory: frontend
        run: |
          vp run build &
          BUILD_PID=$!
          vp test --run &
          TEST_PID=$!
          wait $BUILD_PID
          wait $TEST_PID

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Backend build on Windows (depends on C++ lint only)
  # Runs on: main branch push OR PR with 'test-backend' label
  build-backend:
    name: Build & Test Backend
    runs-on: windows-latest
    needs: lint-cpp
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-backend'))
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Normalize line endings (CRLF)
        run: python scripts/convert_eol.py crlf

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # VS18 同梱 vcpkg-tool は古い detect_compiler portfile を持ち CMake 4.x で永続失敗するため、
      # project-local の vcpkg を vcpkg.json の builtin-baseline SHA で checkout して bootstrap する
      # (ローカル / CI / tool-version-upgrade で同一 snapshot を保証)。
      - name: Bootstrap project-local vcpkg
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json: builtin-baseline missing" }
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $baseline
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install Ninja and ccache
        run: choco install ninja ccache -y

      - name: Setup ccache
        run: |
          echo "CC=cl.exe" >> $env:GITHUB_ENV
          echo "CXX=cl.exe" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~\.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            build/_deps
            build/third_party
            build/CMakeCache.txt
            build/CMakeFiles
            build/**/*.dir
          key: cmake-v3-ninja-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'backend/CMakeLists.txt', 'third_party/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            cmake-v3-ninja-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build (parallel)
        run: cmake --build build --config Release --parallel

      - name: Run Tests (parallel)
        # -LE perf excludes performance benchmarks (run via Benchmarks workflow or `pdg bench backend`)
        run: ctest --test-dir build --output-on-failure --parallel -LE perf

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build
          path: build/Release/
          retention-days: 7

  # Package - only when backend is built (main branch only)
  package:
    name: Package Application
    runs-on: windows-latest
    needs: [build-frontend, build-backend]
    if: >-
      always() &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build-frontend.result == 'success' && needs.build-backend.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-build
          path: package/frontend

      - name: Download backend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-build
          path: package

      - name: List package contents
        run: |
          echo "Package contents:"
          Get-ChildItem -Recurse package | ForEach-Object { $_.FullName }

      - name: Upload packaged application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Velocity-DB-windows-x64
          path: package/
          retention-days: 30

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-cpp, lint-frontend, build-frontend]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-cpp.result }}" != "success" ]] || \
            [[ "${{ needs.lint-frontend.result }}" != "success" ]] || \
            [[ "${{ needs.build-frontend.result }}" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
          fi
          echo "All required jobs passed!"
