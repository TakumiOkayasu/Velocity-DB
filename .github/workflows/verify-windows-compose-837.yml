name: Verify Windows Compose for PR 837

on:
  push:
    branches: [verify/836-windows-compose]

permissions:
  contents: read

jobs:
  windows-compose:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify build, identity, bind mount and artifact
        shell: pwsh
        run: ./scripts/verify-windows-compose-837.ps1
