version: 2
updates:
  # Bun dependencies (frontend)
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    # Wait 7 days before proposing newly published versions (supply-chain mitigation)
    cooldown:
      default-days: 7
    reviewers:
      - "TakumiOkayasu"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Version updates only: coupled Vite+ releases require a compatibility issue.
    # Keep security updates enabled by restricting ignores to version-update types.
    # See docs/TROUBLESHOOTING.md and #828; aliases/overrides cannot update alone.
    ignore:
      - dependency-name: "vite-plus"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "vite"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    # Group minor and patch updates together
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # Wait 7 days before proposing newly published versions (supply-chain mitigation)
    cooldown:
      default-days: 7
    reviewers:
      - "TakumiOkayasu"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
