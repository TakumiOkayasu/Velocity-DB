name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions (read-only)
permissions:
  contents: read

jobs:
  # Test the same pinned release and resolver on both supported platforms.
  lint-cpp-platform:
    name: Lint C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0


      - name: Install locked LLVM
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          # Exercise script-side resolution, without activating LLVM in the shell.
          install_args: --locked github:llvm/llvm-project
          export_path: false
          env: false

      - name: Set up stable VS 2026
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc

      - name: Check Python build scripts
        run: uv run --locked scripts/pdg.py lint python

      - name: Test build scripts and C++ formatting
        env:
          VELOCITYDB_TEST_LLVM: '1'
          VELOCITYDB_FORMAT_MANIFEST: ${{ runner.temp }}/format-manifest.json
        run: uv run --locked scripts/pdg.py test scripts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpp-format-${{ matrix.os }}
          path: ${{ runner.temp }}/format-manifest.json
          retention-days: 1
          if-no-files-found: error

  # Preserve the existing check name and require identical formatting on both OSes.
  lint-cpp:
    name: Lint C++
    runs-on: ubuntu-latest
    needs: lint-cpp-platform
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cpp-format-*
          path: format-results
      - name: Compare Windows and Linux formatting
        run: diff -u format-results/cpp-format-ubuntu-latest/format-manifest.json format-results/cpp-format-windows-latest/format-manifest.json

  # Frontend lint (parallel with C++ lint)
  lint-frontend:
    name: Lint Frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install locked Node and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: --locked node bun
          export_path: true

      - name: Lint and Type Check
        run: uv run --locked scripts/pdg.py lint frontend

  # Compatibility job for branch protection rules
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [lint-cpp, lint-frontend]
    if: always() && needs.lint-cpp.result == 'success' && needs.lint-frontend.result == 'success'
    steps:
      - run: echo "All lint checks passed"

  # Frontend build and test (depends on frontend lint only)
  build-frontend:
    name: Build & Test Frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint-frontend
    if: always() && needs.lint-frontend.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install locked Node and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: --locked node bun
          export_path: true

      - name: Build frontend
        run: uv run --locked scripts/pdg.py build frontend

      - name: Test frontend
        run: uv run --locked scripts/pdg.py test frontend

      - name: Upload build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Backend build on Windows (depends on C++ lint only)
  # Runs on: main branch push OR PR with 'test-backend' label
  build-backend:
    name: Build & Test Backend
    runs-on: windows-latest
    needs: lint-cpp
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-backend'))
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup MSVC Developer Environment
        uses: ./.github/actions/setup-msvc

      - name: Install ccache
        run: choco install ccache -y

      - name: Setup ccache
        run: |
          echo "CC=cl.exe" >> $env:GITHUB_ENV
          echo "CXX=cl.exe" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~\.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            build/_deps
            build/third_party
            build/CMakeCache.txt
            build/CMakeFiles
            build/**/*.dir
          key: cmake-v3-ninja-${{ runner.os }}-${{ env.VELOCITYDB_TOOLCHAIN_KEY }}-${{ hashFiles('CMakeLists.txt', 'backend/CMakeLists.txt', 'third_party/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            cmake-v3-ninja-${{ runner.os }}-${{ env.VELOCITYDB_TOOLCHAIN_KEY }}-

      - name: Configure and build backend
        run: uv run --locked scripts/pdg.py build backend

      - name: Test backend
        run: uv run --locked scripts/pdg.py test backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build
          path: build/Release/
          retention-days: 7

  # Package - only when backend is built (main branch only)
  package:
    name: Package Application
    runs-on: windows-latest
    needs: [build-frontend, build-backend]
    if: >-
      always() &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build-frontend.result == 'success' && needs.build-backend.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-build
          path: package/frontend

      - name: Download backend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-build
          path: package

      - name: List package contents
        run: |
          echo "Package contents:"
          Get-ChildItem -Recurse package | ForEach-Object { $_.FullName }

      - name: Upload packaged application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Velocity-DB-windows-x64
          path: package/
          retention-days: 30

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-cpp, lint-frontend, build-frontend, build-backend]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check all jobs passed
        run: >-
          uv run --locked python scripts/check_ci_results.py
          --lint-cpp "${{ needs.lint-cpp.result }}"
          --lint-frontend "${{ needs.lint-frontend.result }}"
          --build-frontend "${{ needs.build-frontend.result }}"
          --build-backend "${{ needs.build-backend.result }}"
