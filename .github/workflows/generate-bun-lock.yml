name: Finalize TanStack v9 Migration

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/tanstack-table-v9-migration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: fix/tanstack-table-v9-migration
          fetch-depth: 0

      - name: Apply migration patch
        run: |
          sed -i 's/\r$//' .migration/tanstack-v9.patch
          git apply --index .migration/tanstack-v9.patch

      - name: Restore generated Bun lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TakumiOkayasu/Velocity-DB/actions/artifacts/9502896472/zip \
            --output /tmp/generated-bun-lock.zip
          mkdir -p /tmp/generated-bun-lock
          unzip -q /tmp/generated-bun-lock.zip -d /tmp/generated-bun-lock
          cp /tmp/generated-bun-lock/bun.lock frontend/bun.lock

      - name: Configure Bun Dependabot ecosystem
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dependabot = Path('.github/dependabot.yml')
          text = dependabot.read_text()
          old = '  # npm dependencies (frontend)\n  - package-ecosystem: "npm"'
          new = '  # Bun dependencies (frontend)\n  - package-ecosystem: "bun"'
          if old not in text:
              raise SystemExit('expected npm Dependabot frontend configuration')
          dependabot.write_text(text.replace(old, new, 1))
          PY

      - name: Remove migration patch
        run: |
          rm .migration/tanstack-v9.patch
          rmdir .migration

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          working-directory: frontend
          cache: false
          run-install: false

      - name: Validate frozen dependencies
        working-directory: frontend
        run: vp install --frozen-lockfile

      - name: Validate frontend
        working-directory: frontend
        run: |
          vp check
          vp run typecheck
          vp run build
          vp test --run

      - name: Validate migration invariants
        run: |
          git diff --check
          ! grep -R --line-number --fixed-strings 'useReactTable' frontend/src
          ! grep -R --line-number --fixed-strings 'getCoreRowModel' frontend/src
          ! grep -R --line-number --fixed-strings 'package-ecosystem: "npm"' .github/dependabot.yml

      - name: Commit validated non-workflow migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Source/test changes are already staged by git apply --index.
          git add -- .github/dependabot.yml frontend/bun.lock
          git add -u -- .migration/tanstack-v9.patch
          git diff --cached --check
          git status --short
          git commit -m 'fix(frontend): complete TanStack Table v9 migration'
          git push origin HEAD:fix/tanstack-table-v9-migration
