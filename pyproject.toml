[project]
name = "velocity-db"
version = "1.4.3"
description = "High-performance RDBMS management tool"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"  # Windows project

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]

[dependency-groups]
dev = [
    "cmake>=4.4.3",
    "ninja>=1.13.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
required-version = ">=0.12.17"
exclude-newer = "7 days"
