name: Tests

on:
  # Manual trigger only to save Windows minutes
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        default: false
        type: boolean

# Default permissions (read-only)
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSVC
        uses: ./.github/actions/setup-msvc

      - name: Install Ninja
        run: choco install ninja -y

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/_deps
            build/third_party
          key: cmake-ninja-test-${{ runner.os }}-${{ env.VELOCITYDB_TOOLCHAIN_KEY }}-${{ hashFiles('CMakeLists.txt', 'backend/CMakeLists.txt', 'third_party/CMakeLists.txt') }}
          restore-keys: |
            cmake-ninja-test-${{ runner.os }}-${{ env.VELOCITYDB_TOOLCHAIN_KEY }}-

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run C++ Tests
        # -LE perf excludes performance benchmarks (run via Benchmarks workflow or `pdg bench backend`)
        run: ctest --test-dir build --output-on-failure --parallel -LE perf

      - name: Install locked Node and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: --locked node bun
          export_path: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: frontend
        run: bun run test --run

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-build
          path: build/Debug/
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: unit-tests
    if: inputs.run_integration == true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-build
          path: build/Debug

      # Integration tests are disabled by default as they require a database
      # Uncomment when a test database is available
      # - name: Run Integration Tests
      #   run: ctest --test-dir build -R "DISABLED_" --output-on-failure
