name: Regenerate PR 749 lockfile

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/repair-pr749-lock.yml'
      - '.github/scripts/repair_pr749_lock.py'

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.pull_request.number == 749 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dependabot/bun/frontend/development-dependencies-c69597e4fd' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: --locked node bun
          export_path: true
      - name: Align aliases and regenerate with the pinned Bun
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/repair_pr749_lock.py
